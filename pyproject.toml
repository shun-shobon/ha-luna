[project]
name = "ha-luna"
version = "0.1.0"
description = "Home Assistant custom integration that uses Luna as a conversation agent"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
license = "MIT"
authors = [{ name = "shun-shobon" }]

[dependency-groups]
dev = [
    # Requirements of the conversation component, which tests do not install.
    "gazetteer-matcher==1.1.0",
    "hassil==3.12.1",
    "home-assistant-intents==2026.10.6",
    "mypy==2.3.0",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff==0.16.2",
]

[tool.uv]
package = false
exclude-newer = "3 days"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=custom_components.luna --cov-report=term-missing"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/luna"]
exclude = ["tests"]
